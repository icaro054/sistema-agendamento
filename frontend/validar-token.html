<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validar Código - Vitalis Agendamentos</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/auth-fluxo.css"> <!-- Vamos usar um CSS compartilhado para essas etapas -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <main class="tela-auth">
        <div class="caixa-auth">
            <div class="logo-sistema">
                <i class="fa-solid fa-notes-medical"></i>
                <span>Vitalis</span>
            </div>
            
            <h2>Código de Verificação</h2>
            <p>Enviamos um código de 6 dígitos para o seu e-mail. Digite-o abaixo:</p>
            
            <!-- Redireciona para a tela de criar nova senha -->
            <form action="nova-senha.html" method="GET">
                <div class="campo campo-token">
                    <input type="text" id="token" placeholder="000000" maxlength="6" required autocomplete="off">
                </div>
                
                <button type="submit" class="btn-acao">
                    Validar Código <i class="fa-solid fa-check-circle"></i>
                </button>

                <div class="voltar-login">
                    <a href="recuperar-senha.html"><i class="fa-solid fa-arrow-left"></i> Voltar</a>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
