<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - Vitalis Agendamentos</title>
    
    <!-- 1. CSS Global -->
    <link rel="stylesheet" href="css/global.css">
    <!-- 2. CSS Específico desta tela -->
    <link rel="stylesheet" href="css/recuperar-senha.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <main class="tela-recuperacao">
        <div class="caixa-recuperacao">
            
            <div class="logo-sistema">
                <i class="fa-solid fa-notes-medical"></i>
                <span>Vitalis</span>
            </div>
            
            <h2>Recuperação de Senha</h2>
            <p>Informe seu e-mail cadastrado. Enviaremos as instruções para redefinir sua senha.</p>
            
            <!-- Redireciona de volta ao login para simular o envio -->
            <form action="validar-token.html" method="GET"></form>
                <div class="campo">
                    <label for="email">E-mail</label>
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" id="email" placeholder="Digite seu e-mail" required>
                </div>
                
                <button type="submit" class="btn-enviar">
                    Enviar Instruções <i class="fa-regular fa-paper-plane"></i>
                </button>

                <div class="voltar-login">
                    <a href="index.html"><i class="fa-solid fa-arrow-left"></i> Voltar para o Login</a>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
