<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Vitalis Agendamentos</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/auth-fluxo.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <main class="tela-auth" style="height: auto; padding: 40px 0;">
        <div class="caixa-auth" style="max-width: 500px;">
            <div class="logo-sistema">
                <i class="fa-solid fa-notes-medical"></i>
                <span>Vitalis</span>
            </div>
            
            <h2>Crie sua Conta de Paciente</h2>
            <p>Cadastre-se para agendar consultas e acessar seu histórico.</p>
            
            <form id="formCadastro" action="index.html" method="GET">
                
                <div class="campo">
                    <label for="nome">Nome Completo</label>
                    <i class="fa-regular fa-user"></i>
                    <input type="text" id="nome" name="nome" placeholder="Como deseja ser chamado(a)?" required>
                </div>

                <div class="campo">
                    <label for="cpf">CPF</label>
                    <i class="fa-regular fa-id-card"></i>
                    <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required>
                </div>

                <div class="campo">
                    <label for="telefone">Telefone / WhatsApp</label>
                    <i class="fa-solid fa-phone"></i>
                    <input type="text" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>
                </div>

                <div class="campo">
                    <label for="nascimento">Data de Nascimento</label>
                    <i class="fa-regular fa-calendar"></i>
                    <input type="date" id="nascimento" name="nascimento" style="padding-left: 40px;" required>
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" id="email" name="email" placeholder="seu@email.com" required>
                </div>

                <div class="campo">
                    <label for="senha">Criar Senha</label>
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="senha" name="senha" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="btn-acao">
                    Concluir Meu Cadastro <i class="fa-solid fa-check"></i>
                </button>

                <div class="voltar-login">
                    <a href="index.html"><i class="fa-solid fa-arrow-left"></i> Já sou paciente. Entrar</a>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
